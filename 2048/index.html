<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>2048</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#776e65;background:#faf8ef}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;padding:20px 18px max(18px,env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none}main{max-width:440px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(42px,13vw,62px);margin:0;letter-spacing:-3px}.scores{display:flex;gap:8px}.score{background:#bbada0;border-radius:7px;padding:9px 12px;text-align:center;min-width:72px;color:white}.score small{font-size:10px;letter-spacing:1px;color:#eee4da;display:block}.score strong{font-size:22px}p{font-size:14px;line-height:1.6}.tools{display:flex;gap:8px;margin:16px 0}button{font:600 15px -apple-system,sans-serif;border:0;color:white;border-radius:7px;padding:12px 16px;background:#8f7a66;cursor:pointer}button:disabled{opacity:.4}.new{flex:1;background:#f99556}#board{aspect-ratio:1;background:#bbada0;border-radius:9px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;touch-action:none;position:relative}.cell{aspect-ratio:1;border-radius:5px;background:#ccc0b4;display:flex;align-items:center;justify-content:center;font-weight:750;font-size:clamp(25px,8vw,44px)}.cell[data-v="2"]{background:#eee4da}.cell[data-v="4"]{background:#ede0c8}.cell[data-v="8"]{background:#f2b179;color:#fff}.cell[data-v="16"]{background:#f59563;color:#fff}.cell[data-v="32"]{background:#f67c5f;color:#fff}.cell[data-v="64"]{background:#f65e3b;color:#fff}.cell.large{background:#edcf72;color:white;font-size:clamp(22px,6.8vw,36px)}.cell.huge{background:#edc22e;color:white;font-size:clamp(17px,5.7vw,29px)}.fresh{animation:pop .16s ease-out}@keyframes pop{from{transform:scale(.65);opacity:.4}to{transform:scale(1);opacity:1}}.directions{display:flex;justify-content:center;gap:9px;margin-top:18px}.directions button{font-size:22px;padding:8px 19px;background:#bbada0}footer{font-size:11px;line-height:1.7;opacity:.65;margin-top:20px}#status{font-size:12px;min-height:19px}#overlay{position:absolute;inset:0;z-index:2;background:#faf8efe8;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}#overlay[hidden]{display:none}#overlay h2{font-size:30px;margin:0}#overlay p{margin:0}.dialog-actions{display:flex;gap:10px}@media(max-height:680px){body{padding-top:8px}.tools{margin:10px 0}.directions{margin-top:10px}footer{margin-top:10px}p{margin:8px 0}main{max-width:360px}}
</style></head><body><main>
<header><h1>2048</h1><div class="scores"><div class="score"><small>得分</small><strong id="score">0</strong></div><div class="score"><small>最高分</small><strong id="best">0</strong></div></div></header>
<p>滑动棋盘，合并相同数字，挑战 <b>2048</b>！</p>
<div class="tools"><button class="new" id="new">新游戏</button><button id="undo">撤销一步</button><button id="sound" aria-label="切换音效">音效 关</button></div>
<div id="board" role="group" aria-label="2048棋盘"><div id="overlay" hidden><h2 id="message"></h2><p id="detail"></p><div class="dialog-actions"><button id="cancel">继续</button><button id="confirm">重新开始</button></div></div></div>
<div class="directions"><button data-dir="left" aria-label="向左">←</button><button data-dir="up" aria-label="向上">↑</button><button data-dir="down" aria-label="向下">↓</button><button data-dir="right" aria-label="向右">→</button></div>
<p id="status" aria-live="polite">正在读取存档…</p>
<footer>离线运行 · 自动保存进度<br>参考所提供的 scripting 版本适配。<br>@yuyuan</footer>
</main><script src="game.js"></script><script>
const $=id=>document.getElementById(id), E=Game2048;
let state={board:Array(16).fill(0),score:0,best:0,won:false,sound:false}, previous=null, mode='', ready=false;
let sweep=new Audio('assets/sfx_sweep.mp3'), sum=new Audio('assets/sfx_sum.mp3');
const cells=Array.from({length:16},()=>{const el=document.createElement('div');el.className='cell';$('board').insertBefore(el,$('overlay'));return el});
function valid(s){return s && Array.isArray(s.board)&&s.board.length===16&&s.board.every(n=>Number.isInteger(n)&&n>=0&&(n===0||(n>=2&&Number.isInteger(Math.log2(n)))))&&Number.isFinite(s.score)&&s.score>=0&&Number.isFinite(s.best)&&s.best>=0}
let pendingSave=Promise.resolve();
function save(){const snapshot=JSON.parse(JSON.stringify(state));pendingSave=pendingSave.catch(()=>{}).then(async()=>{try{await window.webkit.messageHandlers.save2048.postMessage(snapshot);$('status').textContent='进度已自动保存 · 支持滑动和方向按钮'}catch(e){$('status').textContent='保存失败，请稍后再移动一步重试'}})}
function render(fresh=-1){cells.forEach((el,i)=>{const n=state.board[i];el.textContent=n||'';el.dataset.v=n;el.className='cell'+(n>=1024?' huge':n>=128?' large':'')+(i===fresh?' fresh':'');el.setAttribute('aria-label',n?String(n):'空格')});$('score').textContent=state.score;$('best').textContent=state.best;$('undo').disabled=!previous;$('sound').textContent='音效 '+(state.sound?'开':'关')}
function dialog(type){mode=type;$('overlay').hidden=false;$('message').textContent=type==='win'?'你合成了 2048！':type==='over'?'没有可移动的方块了':'开始新游戏？';$('detail').textContent=type==='win'?'可以继续挑战更大的数字。':type==='over'?'本局得分 '+state.score:'当前这一局会被重置，最高分会保留。';$('cancel').textContent=type==='over'?'撤销一步':type==='reset'?'取消':'继续挑战';$('cancel').disabled=type==='over'&&!previous}
function closeDialog(){$('overlay').hidden=true;mode=''}
function newGame(){closeDialog();state.board=Array(16).fill(0);state.score=0;state.won=false;previous=null;E.spawn(state.board);const id=E.spawn(state.board);render(id);save()}
function move(d){if(!ready||mode)return;const result=E.slide(state.board,d);if(!result.changed)return;previous=JSON.parse(JSON.stringify(state));state.board=result.board;state.score+=result.score;state.best=Math.max(state.best,state.score);const id=E.spawn(state.board);if(state.sound){const audio=result.score?sum:sweep;audio.currentTime=0;audio.play().catch(()=>{})}render(id);if(!state.won&&state.board.some(n=>n>=2048)){state.won=true;dialog('win')}else if(!E.canMove(state.board))dialog('over');save()}
function undo(){if(!previous)return;const best=state.best,sound=state.sound;state=previous;state.best=Math.max(best,state.best);state.sound=sound;previous=null;closeDialog();render();save()}
$('undo').onclick=undo;$('new').onclick=()=>{if(ready)dialog('reset')};$('confirm').onclick=newGame;$('cancel').onclick=()=>mode==='over'?undo():closeDialog();$('sound').onclick=()=>{if(!ready)return;state.sound=!state.sound;render();save()};
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(b.dataset.dir));
let start=null;$('board').addEventListener('touchstart',e=>{start=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});$('board').addEventListener('touchmove',e=>{if(!mode)e.preventDefault()},{passive:false});$('board').addEventListener('touchend',e=>{if(!start)return;const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;start=null;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});$('board').addEventListener('touchcancel',()=>start=null);
document.addEventListener('keydown',e=>{const d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d){e.preventDefault();move(d)}});
(async()=>{try{const stored=await window.webkit.messageHandlers.load2048.postMessage(null);if(valid(stored)){state={...state,...stored};ready=true;render();if(!E.canMove(state.board))dialog('over');$('status').textContent='已恢复上次进度';return}}catch(e){$('status').textContent='无法读取存档，将开始新游戏'}ready=true;newGame()})();
</script></body></html>
